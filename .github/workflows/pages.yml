name: Update market quotes and deploy Portfolio Studio

on:
  push:
    branches: [main]
  schedule:
    # Official end-of-day snapshots, Taiwan time 16:20 / 18:20, trading weekdays.
    # GitHub-hosted scheduled executions can be delayed; refresh page for newest deployed snapshot.
    - cron: '20 8 * * 1-5'
    - cron: '20 10 * * 1-5'
    # US trading session after-hours snapshot: ~06:30 Taipei (Tue-Sat).
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-portfolio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch TWSE TPEx closes and Nasdaq delayed US quotes
        run: python scripts/update_quotes.py
      - name: Commit public market-only cache for static website fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public market quotes [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload rendered public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site with public price snapshots
        id: deployment
        uses: actions/deploy-pages@v4
